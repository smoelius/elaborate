[package]
name = "elaborate-fix"
version = "2.2.0"
authors = ["Samuel Moelius <sam@moeli.us>"]
description = "Replace Rust standard library functions with elaborate wrappers"
edition = "2024"
license = "MIT OR Apache-2.0"
readme = "../README.md"
repository = "https://github.com/trailofbits/elaborate"
rust-version = "1.95"

[dependencies]
anyhow = "1.0"
cargo_metadata = "0.23"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# `rust-analyzer` packages
ra_ap_hir = "0.0.347"
ra_ap_ide = "0.0.347"
ra_ap_ide_db = "0.0.347"
ra_ap_load-cargo = "0.0.347"
ra_ap_project_model = "0.0.347"
ra_ap_vfs = "0.0.347"

elaborate = { path = "../elaborate", version = "=2.2.0" }

[dev-dependencies]
assert_cmd = "2.2"
similar-asserts = "2.0"
tempfile = "3.27"

[lints]
workspace = true
